# Zola configuration for bhc documentation
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://docs.arcanist.sh/bhc"
title = "bhc docs"
description = "Documentation for bhc, the Basel Haskell Compiler: installation, the quick start, runtime profiles, targets, compatibility, compiler internals and the API reference."
default_language = "en"
theme = "purple-haze"

# Compile Sass/SCSS
compile_sass = true

# Generate feed
generate_feeds = false

# Build options
build_search_index = true
minify_html = true

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

[markdown.highlighting]
enabled = true
# Emit scope classes; the arcanist.sh palette lives in themes/purple-haze/sass/components/_arcanist.scss
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[slugify]
paths = "on"
anchors = "on"

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_javascript"

[extra]
# Theme mode
mode = "docs"
# Header lockup: the bhc mark and wordmark with an outlined "docs" key; also sets data-product="bhc" (mauve accent)
lockup = "bhc"
# The colour-scheme switch lives in the footer, not the header (as on arcanist.sh)
show_theme_toggle = false

# Site metadata
author = "arcanist.sh"
github_repo = "https://github.com/arcanist-sh/bhc"
product_url = "https://arcanist.sh/bhc"

# SEO metadata
keywords = "bhc, basel haskell compiler, haskell, compiler, documentation, tutorial, guide, profiles, wasm"

# Social links
github = "https://github.com/arcanist-sh/bhc"

# Documentation configuration
[extra.docs]
versioned = false
default_version = "latest"

# Navigation
# Header navigation: the same menu as arcanist.sh (www.arcanist.sh/config.toml), with absolute URLs.
